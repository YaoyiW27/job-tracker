# Daily refresh, run entirely on GitHub Actions — no need for my Mac to be on.
# Both jobs write straight to the same Neon Postgres the Vercel site reads, so
# there is nothing to redeploy: the site picks up new rows on the next refresh.
#
#   ingest — pulls the public job feeds and upserts them (always runs)
#   score  — LLM fit-scores only jobs with fitScore = null (incremental by design)
#
# Manual runs: Actions tab -> "daily" -> Run workflow (optionally skip scoring or
# raise the per-run scoring cap).
name: daily

on:
  schedule:
    # 14:00 UTC = 07:00 Vancouver (PDT) / 06:00 (PST)
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      run_score:
        description: "Also run the LLM fit scorer"
        type: boolean
        default: true
      score_limit:
        description: "Max jobs to score this run"
        type: string
        default: "40"

# Never let two runs write to the database at once.
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci # postinstall runs `prisma generate`
      - run: npm run ingest

  score:
    needs: ingest
    # Scoring costs API credits, so it is opt-out on manual runs. A scorer
    # failure must not retroactively fail the ingest that already landed.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_score }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      # The scorer reads .private/ (gitignored — never in the repo). Rebuild it
      # from base64 secrets for the length of this run only.
      - name: Restore .private/ scorer context
        env:
          PREFERENCES_B64: ${{ secrets.PRIVATE_PREFERENCES_B64 }}
          RESUME_INFRA_B64: ${{ secrets.PRIVATE_RESUME_INFRA_B64 }}
          RESUME_MLINFRA_B64: ${{ secrets.PRIVATE_RESUME_MLINFRA_B64 }}
        run: |
          set -euo pipefail
          for name in PREFERENCES_B64 RESUME_INFRA_B64 RESUME_MLINFRA_B64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret PRIVATE_$name — see README (GitHub Actions setup)."
              exit 1
            fi
          done
          mkdir -p .private
          printf '%s' "$PREFERENCES_B64"   | base64 --decode > .private/preferences.md
          printf '%s' "$RESUME_INFRA_B64"  | base64 --decode > .private/resume-infra.tex
          printf '%s' "$RESUME_MLINFRA_B64" | base64 --decode > .private/resume-mlinfra.tex
          # Sizes only — never the contents.
          wc -c .private/preferences.md .private/resume-infra.tex .private/resume-mlinfra.tex

      - run: npm run score -- --limit "${{ inputs.score_limit || '40' }}"
